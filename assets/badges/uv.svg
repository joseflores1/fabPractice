    <rect width="75" height="20" fill="url(#g)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-rendering="geometricPrecision" transform="scale(.1)">
    <text x="110" y="150" fill="#010101" fill-opacity=".3" transform="translate(0 1)">uv</text>
    <text x="110" y="140">uv</text>
    <text x="480" y="150" fill="#010101" fill-opacity=".3" transform="translate(0 1)">managed</text>
